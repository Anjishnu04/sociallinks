<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Anjishnu Sarkar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root{--bg:#0a0a0a;--card:#141414;--line:#242424;--ink:#f4f4f2;--muted:#8a8a88;--icobg:#1d1d1d;--hl:#f2f2f0;--hl-ink:#0a0a0a;--hl-ico:#dcdcd9;--hl-muted:#555;--ring:#1c1c1c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f4f4f2;--card:#fff;--line:#dedede;--ink:#0a0a0a;--muted:#6b6b69;--icobg:#efefed;--hl:#0a0a0a;--hl-ink:#f4f4f2;--hl-ico:#2a2a2a;--hl-muted:#aaa;--ring:#e4e4e2}}
:root[data-theme="light"]{--bg:#f4f4f2;--card:#fff;--line:#dedede;--ink:#0a0a0a;--muted:#6b6b69;--icobg:#efefed;--hl:#0a0a0a;--hl-ink:#f4f4f2;--hl-ico:#2a2a2a;--hl-muted:#aaa;--ring:#e4e4e2}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:56px 20px 40px}
main{width:100%;max-width:440px;text-align:center}
.avatar{width:132px;height:132px;border-radius:50%;padding:6px;background:var(--ring);border:1px solid var(--line);margin:0 auto 22px}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
h1{margin:0;font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-1px}
p.sub{margin:10px 0 0;color:var(--muted);font-size:17px}
.loc{display:inline-flex;align-items:center;gap:7px;margin:18px 0 0;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--muted);font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-size:13px}
ul{list-style:none;margin:30px 0 0;padding:0;display:flex;flex-direction:column;gap:12px;text-align:left}
a.link{display:flex;align-items:center;gap:16px;padding:14px 18px 14px 14px;background:var(--card);border:1px solid var(--line);border-radius:18px;color:var(--ink);text-decoration:none;transition:background .15s,color .15s}
.ico{width:54px;height:54px;border-radius:14px;background:var(--icobg);display:grid;place-items:center;flex:none}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.label{font-weight:600;font-size:17px}
.value{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.go{color:var(--muted);flex:none}
a.link:hover,a.link.first{background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
a.link:hover .ico,a.link.first .ico{background:var(--hl-ico)}
a.link:hover .value,a.link.first .value,a.link:hover .go,a.link.first .go{color:var(--hl-muted)}
ul:hover a.link.first:not(:hover){background:var(--card);color:var(--ink);border-color:var(--line)}
ul:hover a.link.first:not(:hover) .ico{background:var(--icobg)}
ul:hover a.link.first:not(:hover) .value,ul:hover a.link.first:not(:hover) .go{color:var(--muted)}
a.link:focus-visible{outline:3px solid #7f9bff;outline-offset:2px}
footer{margin-top:38px;font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){a.link{transition:none}}
</style>
</head>
